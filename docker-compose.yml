version: '3.8'

services:
  # PostgreSQL 16 Relational Store
  postgres:
    image: postgres:16-alpine
    container_name: bioscribe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bioscribe_user
      POSTGRES_PASSWORD: bioscribe_password
      POSTGRES_DB: bioscribe_eln
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioscribe_user -d bioscribe_eln"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 Cache & Presence Engine
  redis:
    image: redis:7-alpine
    container_name: bioscribe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express.js + TypeScript REST API
  api:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: bioscribe_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://bioscribe_user:bioscribe_password@postgres:5432/bioscribe_eln
      REDIS_URL: redis://redis:6379
      JWT_SECRET: bioscribe-super-secret-scientific-eln-token-2026
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"

  # React + TypeScript + Vite SPA Client
  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: bioscribe_client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
